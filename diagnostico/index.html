<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico · Menor Preço Paraná</title><style>body{font:16px/1.6 system-ui;background:#f5f8f4;color:#24352e;max-width:960px;margin:40px auto;padding:20px}form,section{background:white;padding:24px;border:1px solid #dce4d7;border-radius:12px;margin:20px 0}label{display:inline-grid;gap:4px;margin:8px 12px 8px 0}input,select,button{font:inherit;padding:9px;border:1px solid #cad9c1;border-radius:6px;max-width:100%}button{background:#217448;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{display:block;color:#60735a}</style><h1>Diagnóstico do Menor Preço Paraná</h1><p>Esta consulta é feita pelo servidor desta página. Compare o resultado com a mesma URL no computador e no 5G.</p><form id="form"><label>Endpoint<select name="endpoint"><option>categorias</option><option>produtos</option></select></label><label>Descrição<input name="termo" value="arroz" required maxlength="120"></label><label>Local<input name="local" value="6gkzqf9vb" required></label><label>Raio (km)<input name="raio" type="number" value="2" min="1" max="50" required></label><label>Categoria (produtos)<input name="categoria" type="number" value="6" min="0"></label><label>Ordem (produtos)<select name="ordem"><option value="0">Menor preço</option><option value="1">Menor distância</option><option value="2">Mais recentes</option><option value="3">Maior preço</option></select></label><p><button id="send">Consultar pelo servidor</button></p><small>Uma consulta por clique. Nenhuma mudança automática de IP. Categorias não usa categoria nem ordem.</small></form><section aria-live="polite"><strong id="status">Aguardando consulta.</strong><pre id="output"></pre></section><script>const form=document.querySelector('#form'),button=document.querySelector('#send'),status=document.querySelector('#status'),output=document.querySelector('#output');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='Consultando…';output.textContent='';try{const r=await fetch('/api/teste?'+new URLSearchParams(new FormData(form)),{signal:AbortSignal.timeout(30000)});const data=await r.json();status.textContent=data.error?'Consulta falhou':`API: HTTP ${data.statusAPI} · Formato: ${data.formato} · Quantidade: ${data.quantidade??'—'}`;output.textContent=JSON.stringify(data,null,2);}catch{status.textContent='Falha de conexão. Se o serviço estava inativo, aguarde e tente novamente.';}finally{button.disabled=false;}});</script></html>
