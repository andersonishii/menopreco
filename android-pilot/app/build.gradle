plugins { id 'com.android.application' }
android {
    namespace 'com.precoperto.piloto'
    compileSdk 34
    defaultConfig {
        applicationId 'com.precoperto.piloto'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2.0'
        testInstrumentationRunner providers.gradleProperty('pilotTestRunner').getOrElse('com.precoperto.piloto.PilotInstrumentation')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
